name: Copilot Guest E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/copilot-guest-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Copilot Guest real-web probe
        run: npm run test:e2e

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-guest-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
